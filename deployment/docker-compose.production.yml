services:
  backend:
    image: ghcr.io/your-org/grievance-platform-backend:latest
    restart: unless-stopped
    env_file: .env.production
    ports: ["4000:4000"]
  ai-service:
    image: ghcr.io/your-org/grievance-platform-ai:latest
    restart: unless-stopped
    env_file: .env.production
    ports: ["8000:8000"]
  frontend:
    image: ghcr.io/your-org/grievance-platform-frontend:latest
    restart: unless-stopped
    ports: ["8080:80"]
